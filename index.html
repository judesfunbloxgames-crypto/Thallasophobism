<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abyssal Breach: Subcomplex 115</title>
  <style>
    :root {
      --bg: #020712;
      --panel: #081425;
      --accent: #3bc7d6;
      --danger: #f0626a;
      --text: #d6f0ff;
      --muted: #8aa8bb;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 30% 20%, #09203d 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    .game {
      width: min(1000px, 100%);
      background: linear-gradient(160deg, rgba(7, 20, 37, 0.95), rgba(3, 8, 15, 0.95));
      border: 1px solid rgba(59, 199, 214, 0.3);
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: 0 0 20px rgba(59, 199, 214, 0.2);
      display: grid;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 0.8rem;
    }

    .stat {
      background: rgba(10, 28, 48, 0.85);
      border: 1px solid rgba(138, 168, 187, 0.22);
      border-radius: 10px;
      padding: 0.6rem;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin-top: 0.2rem;
      font-size: 1.05rem;
      font-weight: bold;
    }

    #roomDescription,
    #eventLog {
      background: rgba(3, 15, 27, 0.95);
      border: 1px solid rgba(59, 199, 214, 0.2);
      border-radius: 10px;
      padding: 0.9rem;
      min-height: 88px;
      line-height: 1.4;
    }

    #eventLog {
      border-color: rgba(240, 98, 106, 0.35);
      white-space: pre-line;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    button {
      border: 1px solid rgba(59, 199, 214, 0.4);
      background: #092c45;
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover:enabled {
      filter: brightness(1.18);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .danger {
      border-color: rgba(240, 98, 106, 0.45);
      background: #421220;
    }

    .footer-note {
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      .stats,
      .controls {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Abyssal Breach: Subcomplex 115</h1>

    <section class="stats">
      <div class="stat"><div class="stat-label">Room</div><div id="roomNum" class="stat-value"></div></div>
      <div class="stat"><div class="stat-label">Integrity</div><div id="health" class="stat-value"></div></div>
      <div class="stat"><div class="stat-label">Sanity</div><div id="sanity" class="stat-value"></div></div>
      <div class="stat"><div class="stat-label">Entities Seen</div><div id="seen" class="stat-value"></div></div>
    </section>

    <section id="roomDescription"></section>
    <section id="eventLog"></section>

    <section class="controls">
      <button id="advanceBtn">Advance to Next Room</button>
      <button id="scanBtn">Scan Room</button>
      <button id="hideBtn">Hide</button>
      <button id="fightBtn" class="danger">Fight</button>
    </section>

    <div class="footer-note">
      Survive all <strong>115</strong> rooms and reach the dry command vault. Every room may hold multiple entities.
    </div>
  </main>

  <script>
    const TOTAL_ROOMS = 115;

    const roomPrefixes = [
      "Pressure", "Abyssal", "Drowned", "Rusted", "Shivering", "Silent", "Leaking", "Blackwater", "Crushing", "Frozen"
    ];
    const roomTypes = [
      "Pump Hall", "Crew Quarters", "Maintenance Spine", "Hydroponics Bay", "Armory Annex", "Turbine Gallery", "Med Ward", "Lab Cluster", "Cargo Trench", "Observation Ring"
    ];
    const hazards = [
      "flickering emergency lights", "waist-high water", "burst pipes screaming steam", "low visibility plankton clouds", "floating debris fields", "electrical arcs in the ceiling"
    ];
    const entityNames = [
      "The Sonar Widow", "Brine Stalker", "Murmur Eel", "Hull Gnawer", "The Drowned Pilot", "Floodborn Choir", "Glassjaw Leviathan", "Anchor Hound", "Silt Warden", "Pressure Shade",
      "Crabbed Priest", "Echo Maw", "Gasket Mimic", "Widowfish Swarm", "The Blind Navigator"
    ];

    const game = {
      room: 1,
      health: 100,
      sanity: 100,
      seen: new Set(),
      scanned: false,
      currentEntities: [],
      ended: false
    };

    const ui = {
      roomNum: document.getElementById("roomNum"),
      health: document.getElementById("health"),
      sanity: document.getElementById("sanity"),
      seen: document.getElementById("seen"),
      roomDescription: document.getElementById("roomDescription"),
      eventLog: document.getElementById("eventLog"),
      advanceBtn: document.getElementById("advanceBtn"),
      scanBtn: document.getElementById("scanBtn"),
      hideBtn: document.getElementById("hideBtn"),
      fightBtn: document.getElementById("fightBtn")
    };

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(arr) {
      return arr[rand(0, arr.length - 1)];
    }

    function makeRoomDescription() {
      const name = `${pick(roomPrefixes)} ${pick(roomTypes)}`;
      const hazard = pick(hazards);
      return `Room ${game.room}/${TOTAL_ROOMS} — ${name}.\nThe compartment groans under pressure with ${hazard}.`;
    }

    function spawnEntities() {
      const maxEntities = game.room > 80 ? 3 : game.room > 35 ? 2 : 1;
      const count = rand(0, maxEntities);
      const entities = [];
      for (let i = 0; i < count; i++) {
        entities.push(pick(entityNames));
      }
      if (game.room % 23 === 0) {
        entities.push("Apex Entity: The Cathedral Angler");
      }
      return entities;
    }

    function statusText() {
      ui.roomNum.textContent = `${game.room} / ${TOTAL_ROOMS}`;
      ui.health.textContent = `${Math.max(game.health, 0)}%`;
      ui.sanity.textContent = `${Math.max(game.sanity, 0)}%`;
      ui.seen.textContent = `${game.seen.size}`;
    }

    function endGame(message) {
      game.ended = true;
      ui.eventLog.textContent = message;
      ui.advanceBtn.disabled = true;
      ui.scanBtn.disabled = true;
      ui.hideBtn.disabled = true;
      ui.fightBtn.disabled = true;
    }

    function generateRoom() {
      game.scanned = false;
      game.currentEntities = spawnEntities();
      game.currentEntities.forEach(e => game.seen.add(e));
      ui.roomDescription.textContent = makeRoomDescription();

      if (game.currentEntities.length === 0) {
        ui.eventLog.textContent = "No movement on sonar... for now.";
      } else {
        ui.eventLog.textContent = `You hear movement in the dark water. ${game.currentEntities.length} hostile signature(s) detected.`;
      }

      if (game.room === TOTAL_ROOMS) {
        ui.eventLog.textContent += "\nThe command vault hatch is visible through the flooded corridor.";
      }

      statusText();
    }

    function advanceRoom() {
      if (game.ended) return;

      if (game.currentEntities.length > 0) {
        game.health -= rand(4, 12);
        game.sanity -= rand(3, 8);
        ui.eventLog.textContent = "You tried to move while hunted and were attacked in the current room.";
      } else {
        game.health -= rand(0, 2);
        game.sanity -= 1;
      }

      if (game.health <= 0 || game.sanity <= 0) {
        endGame("You collapse in the deep. The complex keeps your name.");
        statusText();
        return;
      }

      if (game.room >= TOTAL_ROOMS) {
        endGame("You sealed the vault and surfaced the complex. You survived all 115 rooms.");
        return;
      }

      game.room += 1;
      generateRoom();
    }

    function scanRoom() {
      if (game.ended) return;
      game.scanned = true;
      if (game.currentEntities.length === 0) {
        ui.eventLog.textContent = "Scan complete: empty room, but distant knocks answer your ping.";
        return;
      }

      const entities = [...new Set(game.currentEntities)].join(", ");
      game.sanity -= rand(1, 4);
      ui.eventLog.textContent = `Scan complete: ${entities}.\nKnowing what is here costs you sleep and nerve.`;
      statusText();

      if (game.sanity <= 0) {
        endGame("Your mind fractures in the static and dark water.");
      }
    }

    function hide() {
      if (game.ended) return;
      if (game.currentEntities.length === 0) {
        ui.eventLog.textContent = "You hide inside a locker anyway. Nothing finds you.";
        game.sanity -= 1;
      } else {
        const success = Math.random() < 0.65;
        if (success) {
          ui.eventLog.textContent = "You stay still as shadows pass. The entities drift away.";
          game.currentEntities = [];
          game.sanity -= rand(1, 3);
        } else {
          ui.eventLog.textContent = "Your breath fogs your visor. Something sees you.";
          game.health -= rand(8, 15);
          game.sanity -= rand(5, 10);
        }
      }

      statusText();
      if (game.health <= 0 || game.sanity <= 0) {
        endGame("The hiding place becomes your tomb.");
      }
    }

    function fight() {
      if (game.ended) return;
      if (game.currentEntities.length === 0) {
        ui.eventLog.textContent = "You swing at the water. Only your reflection breaks.";
        game.sanity -= 2;
        statusText();
        return;
      }

      const power = rand(25, 100);
      const threshold = 35 + game.currentEntities.length * 18;

      if (power >= threshold) {
        ui.eventLog.textContent = `You force the entities back with flares and shock rounds. Room secured.`;
        game.currentEntities = [];
        game.health -= rand(3, 7);
      } else {
        ui.eventLog.textContent = `The fight turns brutal. You survive, but not untouched.`;
        game.health -= rand(12, 24);
        game.sanity -= rand(8, 16);
      }

      statusText();
      if (game.health <= 0 || game.sanity <= 0) {
        endGame("Your final stand sinks beneath the alarms.");
      }
    }

    ui.advanceBtn.addEventListener("click", advanceRoom);
    ui.scanBtn.addEventListener("click", scanRoom);
    ui.hideBtn.addEventListener("click", hide);
    ui.fightBtn.addEventListener("click", fight);

    generateRoom();
  </script>
</body>
</html>
